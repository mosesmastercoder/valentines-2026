<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5c1a1a" />
    <title>Will you be my Valentine?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="theme-switcher">
      <button
        class="theme-btn theme-btn-brown active"
        data-theme="brown"
        title="Brown Theme"
      ></button>
      <button
        class="theme-btn theme-btn-green"
        data-theme="green"
        title="Green Theme"
      ></button>
      <button
        class="theme-btn theme-btn-pink"
        data-theme="pink"
        title="Pink Theme"
      ></button>
    </div>

    <div id="mainContainer" class="main-container">
      <div id="landingState" class="state-section">
        <div class="landing-content">
          <p class="landing-text">
            Will you be my Valentine for the fourth time?
          </p>
          <div class="landing-button-group">
            <button id="landingNoBtn" class="btn-landing btn-landing-no">
              No
            </button>
            <button id="landingYesBtn" class="btn-landing btn-landing-yes">
              Yes
            </button>
          </div>
          <div id="landingNoMessage" class="landing-no-message"></div>
        </div>
      </div>

      <div id="initialState" class="state-section hidden">
        <div class="envelope-container">
          <div id="envelope" class="envelope">
            <div class="envelope-back"></div>
            <div class="flap"></div>
            <div id="letter" class="letter">
              <div class="letter-content">
                <p id="letterMainText" class="letter-question">
                  Yay! I was scared you did not want me na! I love you baby
                  muwah hehe
                </p>
                <p id="noClicksMessage" class="letter-note"></p>
                <button
                  id="inlineSurpriseBtn"
                  class="btn-handwritten btn-surprise"
                >
                  Click to see surprise
                </button>
                <div class="button-container-letter">
                  <button id="noBtn" class="btn-handwritten btn-no">No</button>
                  <button id="yesBtn" class="btn-handwritten btn-yes">
                    Yes
                  </button>
                </div>
              </div>
            </div>
            <div class="pocket"></div>
          </div>
        </div>
      </div>

      <div id="videoState" class="state-section hidden">
        <video
          id="surpriseVideo"
          class="surprise-video"
          autoplay
          playsinline
          muted
          loop
          controls
        >
          <source src="surprise.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
