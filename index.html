<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5c1a1a" />
    <title>Will you be my Valentine?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --theme-bg: #8d5b38;
        --theme-bg-dark: #6f4528;
        --theme-accent: #c9a27d;
        --paper-color: #f5f1ed;
        --ink-color: #2c2c2c;
        --wine-color: #bd2e51;
        --text-light: #f5f1ed;
      }

      :root[data-theme="green"] {
        --theme-bg: #086f6d;
        --theme-bg-dark: #055352;
        --theme-accent: #9fd6d3;
      }

      :root[data-theme="pink"] {
        --theme-bg: #bd2e51;
        --theme-bg-dark: #9e2441;
        --theme-accent: #f2a6b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Raleway", sans-serif;
        background-color: var(--theme-bg);
        color: var(--ink-color);
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        transition: background-color 0.9s ease;
      }

      .main-container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      .state-section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        gap: 30px;
        opacity: 1;
        transition: opacity 0.6s ease;
        z-index: 10;
      }

      .state-section.hidden {
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }

      .theme-switcher {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 200;
      }

      .theme-btn {
        width: 24px;
        height: 24px;
        border-radius: 3px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .theme-btn-brown {
        background-color: #8d5b38;
      }

      .theme-btn-green {
        background-color: #086f6d;
      }

      .theme-btn-pink {
        background-color: #bd2e51;
      }

      .theme-btn.active {
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        transform: scale(1.15);
      }

      .theme-btn:hover {
        border-color: rgba(255, 255, 255, 0.6);
      }

      .envelope-container {
        width: 380px;
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1400px;
        margin: 0 auto;
        position: relative;
        overflow: visible;
      }

      .envelope {
        position: relative;
        width: 340px;
        height: 260px;
        perspective: 1000px;
        margin: 0 auto;
      }

      .envelope-back {
        position: absolute;
        bottom: 8px;
        left: 0;
        width: 100%;
        height: 245px;
        background: #f3b7c4;
        border-radius: 2px;
        z-index: 2;
      }

      .pocket {
        position: absolute;
        bottom: 8px;
        left: 0;
        width: 0;
        height: 0;
        border-left: 170px solid #f3b7c4;
        border-right: 170px solid #f3b7c4;
        border-bottom: 120px solid #f3b7c4;
        border-top: 120px solid transparent;
        z-index: 3;
      }

      .pocket::before,
      .pocket::after {
        content: "";
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        background: #e0d3c7;
        transform: translateZ(-10px);
        -webkit-transform: translateZ(-10px);
        will-change: transform;
      }

      .pocket::before {
        left: 0;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
      }

      .pocket::after {
        right: 0;
        clip-path: polygon(100% 0, 0 50%, 100% 100%);
      }

      .flap {
        position: absolute;
        top: 8px;
        left: 0;
        width: 0;
        height: 0;
        border-left: 170px solid transparent;
        border-right: 170px solid transparent;
        border-top: 120px solid #fff6ec;
        transform-origin: top center;
        transition: transform 0.6s ease;
        backface-visibility: visible;
        z-index: 5;
      }

      .flap::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #f5ede3 0%, #eee4d9 100%);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: center center;
        transform: rotateX(180deg);
        -webkit-backface-visibility: visible;
        backface-visibility: visible;
        pointer-events: none;
      }

      .letter {
        position: absolute;
        bottom: 18px;
        left: 5%;
        width: 90%;
        min-height: 240px;
        background: #fff6ec;
        padding: 18px 16px 22px;
        border-radius: 4px;
        opacity: 0;
        transform: translateY(0);
        transition:
          transform 0.8s ease,
          opacity 0.4s ease;
        z-index: 4;
      }

      .letter-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .letter-question {
        font-size: 17px;
        font-weight: 500;
        color: var(--ink-color);
        margin-bottom: 35px;
        letter-spacing: 0.3px;
        line-height: 1.3;
      }

      .letter-response {
        font-size: 15px;
        font-weight: 500;
        color: var(--ink-color);
        margin-bottom: 25px;
        letter-spacing: 0.2px;
      }

      .letter-note {
        font-size: 14px;
        color: var(--wine-color);
        font-style: italic;
        margin-bottom: 20px;
        letter-spacing: 0.2px;
        display: block;
      }

      .letter-signature {
        font-size: 10px;
        margin: 8px 0 20px 0;
        opacity: 0.7;
      }

      .button-container-letter {
        display: none;
        pointer-events: none;
        gap: 30px;
        justify-content: center;
        margin-top: 40px;
      }

      .btn-handwritten {
        padding: 11px 32px;
        font-size: 12px;
        font-weight: 500;
        border: 2px solid var(--ink-color);
        border-radius: 2px;
        background: transparent;
        color: var(--ink-color);
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Raleway", sans-serif;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        box-shadow: none;
      }

      .btn-no {
        border-color: var(--ink-color);
        color: var(--ink-color);
        rotate: 1deg;
      }

      .btn-yes {
        border-color: var(--theme-accent);
        color: var(--theme-accent);
        font-weight: 600;
        rotate: -1deg;
      }

      .btn-handwritten.hidden {
        display: none;
      }

      .letter-opened {
        width: 100%;
        max-width: 320px;
        background: linear-gradient(
          135deg,
          var(--paper-color) 0%,
          #f0ebe7 100%
        );
        border: 3px solid var(--ink-color);
        border-radius: 12px;
        padding: 50px 35px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.9s ease;
        max-height: 70vh;
        overflow-y: auto;
      }

      #noClicksMessage {
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 16px;
        opacity: 0.8;
      }

      .letter-opened-content {
        text-align: center;
      }

      .letter-opened-content .letter-question {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .letter-opened-content .letter-response {
        font-size: 28px;
        margin-bottom: 20px;
      }

      .letter-opened-content .letter-note {
        font-size: 14px;
        margin-bottom: 24px;
        display: block;
      }

      #surpriseBtn {
        margin-top: 30px;
        padding: 12px 32px;
        font-size: 15px;
      }

      .surprise-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      #videoState.state-section:not(.hidden) {
        z-index: 100;
        background: #000;
        gap: 0;
        padding: 0;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          transform: translateX(-10px);
        }
        20%,
        40%,
        60%,
        80% {
          transform: translateX(10px);
        }
      }

      .envelope.shake {
        animation: shake 0.5s ease-in-out;
      }

      @keyframes envelopeFlapOpen {
        from {
          transform: rotateX(0deg);
        }
        to {
          transform: rotateX(180deg);
        }
      }

      @keyframes envelopeLetterSlide {
        from {
          transform: translate(-50%, 120%);
        }
        to {
          transform: translate(-50%, -20%);
        }
      }

      .envelope.opening .flap {
        transform: rotateX(180deg);
        z-index: 1;
      }

      .envelope.opening .letter {
        transform: translateY(-90px);
        opacity: 1;
      }

      .envelope.opening {
        animation: none;
      }

      #landingState {
        justify-content: center;
        align-items: center;
      }

      .landing-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        text-align: center;
        width: 100%;
        max-width: 500px;
        padding: 20px;
      }

      .landing-text {
        font-family: "Caveat", cursive;
        font-size: 32px;
        font-weight: 700;
        color: var(--text-light);
        letter-spacing: 0.5px;
        line-height: 1.4;
        margin: 0;
      }

      .landing-button-group {
        display: flex;
        gap: 32px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn-landing {
        padding: 14px 40px;
        font-size: 16px;
        font-weight: 500;
        border: 3px solid rgba(255, 255, 255, 0.7);
        border-radius: 8px;
        background: transparent;
        color: rgba(255, 255, 255, 0.85);
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: "Raleway", sans-serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        user-select: none;
        touch-action: manipulation;
      }

      @keyframes wag {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(0deg);
        }
        75% {
          transform: rotate(6deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      .btn-landing.wag {
        animation: wag 0.4s ease-in-out;
      }

      .landing-no-message {
        font-family: "Raleway", sans-serif;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        margin-top: -20px;
        min-height: 20px;
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
      }

      .letter-question,
      .letter-response,
      .letter-note,
      .btn-handwritten,
      .letter-opened,
      .envelope,
      .landing-text,
      .btn-landing {
        -webkit-user-select: none;
        user-select: none;
      }

      @media (max-width: 430px) {
        @supports (padding: max(0px)) {
          .main-container {
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
          }
        }

        .envelope-container {
          width: 240px;
          height: 260px;
        }

        .flap {
          top: 0;
        }

        .pocket {
          bottom: 0px;
          height: 100%;
        }

        .letter {
          bottom: 5px;
        }

        .letter-content {
          padding: 10px 10px;
        }

        .letter-question {
          font-size: 16px;
        }

        .letter-response {
          font-size: 16px;
        }

        .btn-handwritten {
          padding: 9px 24px;
          font-size: 14px;
          letter-spacing: 0.8px;
        }

        .button-container-letter {
          gap: 16px;
          margin-top: 16px;
        }

        .letter-opened {
          max-width: 280px;
          padding: 40px 25px;
        }

        .letter-opened-content .letter-question {
          font-size: 18px;
        }

        .letter-opened-content .letter-response {
          font-size: 22px;
        }

        .letter-opened-content .letter-note {
          font-size: 13px;
        }

        #surpriseBtn {
          padding: 11px 28px;
          font-size: 14px;
        }

        .landing-text {
          font-size: 24px;
          line-height: 1.3;
        }

        .btn-landing {
          padding: 12px 32px;
          font-size: 14px;
          letter-spacing: 1px;
          border-width: 2.5px;
        }

        .landing-button-group {
          gap: 24px;
        }

        .landing-no-message {
          font-size: 13px;
        }

        .btn-surprise {
          align-self: center;
          margin-top: auto;
          padding: 10px 18px;
          border: 2px solid currentColor;
          background: transparent;
        }

        .theme-switcher {
          top: 16px;
          right: 16px;
        }

        .theme-btn {
          width: 22px;
          height: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="theme-switcher">
      <button
        class="theme-btn theme-btn-brown active"
        data-theme="brown"
        title="Brown Theme"
      ></button>
      <button
        class="theme-btn theme-btn-green"
        data-theme="green"
        title="Green Theme"
      ></button>
      <button
        class="theme-btn theme-btn-pink"
        data-theme="pink"
        title="Pink Theme"
      ></button>
    </div>

    <div id="mainContainer" class="main-container">
      <div id="landingState" class="state-section">
        <div class="landing-content">
          <p class="landing-text">
            Will you be my Valentine for the fourth time?
          </p>
          <div class="landing-button-group">
            <button id="landingNoBtn" class="btn-landing btn-landing-no">
              No
            </button>
            <button id="landingYesBtn" class="btn-landing btn-landing-yes">
              Yes
            </button>
          </div>
          <div id="landingNoMessage" class="landing-no-message"></div>
        </div>
      </div>

      <div id="initialState" class="state-section hidden">
        <div class="envelope-container">
          <div id="envelope" class="envelope">
            <div class="envelope-back"></div>
            <div class="flap"></div>
            <div id="letter" class="letter">
              <div class="letter-content">
                <p id="letterMainText" class="letter-question">
                  Yay! Mwahahahaha abi ko indi ka na sakon! I love you baby
                  muwah see you sa 13 heheheh
                </p>
                <p id="noClicksMessage" class="letter-note"></p>
                <button
                  id="inlineSurpriseBtn"
                  class="btn-handwritten btn-surprise"
                >
                  Click to see surprise
                </button>
                <div class="button-container-letter">
                  <button id="noBtn" class="btn-handwritten btn-no">No</button>
                  <button id="yesBtn" class="btn-handwritten btn-yes">
                    Yes
                  </button>
                </div>
              </div>
            </div>
            <div class="pocket"></div>
          </div>
        </div>
      </div>

      <div id="videoState" class="state-section hidden">
        <video id="surpriseVideo" class="surprise-video" autoplay playsinline
          muted loop controls>
          <source src="surprise.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <script>
      let noClickCount = 0;

      const envelope = document.getElementById("envelope");
      const letter = document.getElementById("letter");
      const inlineSurpriseBtn = document.getElementById("inlineSurpriseBtn");
      const initialState = document.getElementById("initialState");
      const videoState = document.getElementById("videoState");
      const noClicksMessage = document.getElementById("noClicksMessage");
      const themeBtns = document.querySelectorAll(".theme-btn");
      const landingState = document.getElementById("landingState");
      const landingNoBtn = document.getElementById("landingNoBtn");
      const landingYesBtn = document.getElementById("landingYesBtn");

      themeBtns.forEach((btn) => {
        btn.addEventListener("click", function () {
          setTheme(this.getAttribute("data-theme"));
        });
      });

      function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeBtns.forEach((btn) => {
          btn.classList.toggle(
            "active",
            btn.getAttribute("data-theme") === theme,
          );
        });
        localStorage.setItem("valentineTheme", theme);
      }

      function loadTheme() {
        setTheme(localStorage.getItem("valentineTheme") || "brown");
      }

      function handleLandingNoClick() {
        noClickCount++;
        landingNoBtn.classList.remove("wag");
        void landingNoBtn.offsetWidth;
        landingNoBtn.classList.add("wag");
        setTimeout(() => {
          landingNoBtn.classList.remove("wag");
        }, 400);
      }

      function handleLandingYesClick() {
        const landingNoCount = noClickCount;
        landingState.classList.add("hidden");

        setTimeout(() => {
          initialState.classList.remove("hidden");
          noClicksMessage.textContent =
            landingNoCount > 0
              ? `Kit-an ta ka nagpindot no ka ${landingNoCount}, ano man na man!`
              : "";

          setTimeout(() => {
            envelope.classList.add("opening");
          }, 500);
        }, 300);
      }

      function handleSurpriseClick() {
        initialState.classList.add("hidden");

        setTimeout(() => {
          videoState.classList.remove("hidden");
          const video = document.getElementById("surpriseVideo");
          video?.play().catch(() => {});
        }, 300);
      }

      function initialize() {
        loadTheme();
        landingState.classList.remove("hidden");
        initialState.classList.add("hidden");
        videoState.classList.add("hidden");
        noClickCount = 0;
        envelope.classList.remove("opening");
        inlineSurpriseBtn?.addEventListener("click", handleSurpriseClick);
      }

      landingNoBtn.addEventListener("click", handleLandingNoClick);
      landingYesBtn.addEventListener("click", handleLandingYesClick);

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initialize);
      } else {
        initialize();
      }
    </script>
  </body>
</html>
